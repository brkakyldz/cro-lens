<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taskloop — Plan your week in one view</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  header { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  #cookie-banner { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
  #cookie-banner div { background: #fff; padding: 24px; max-width: 420px; }
</style>
</head>
<body>
<header>
  <h1>Plan your week in one view</h1>
  <p>Taskloop turns your inbox, calendar and to-dos into one weekly plan.</p>
  <a href="/signup">Get started free</a>
</header>
<div id="cookie-banner">
  <div>
    <p>We use cookies to improve your experience.</p>
    <button type="button" onclick="document.getElementById('cookie-banner').remove()">Accept all</button>
    <button type="button" onclick="document.getElementById('cookie-banner').remove()">Reject all</button>
  </div>
</div>
</body>
</html>
