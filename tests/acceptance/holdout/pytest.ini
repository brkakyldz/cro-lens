[pytest]
# cro-lens held-out acceptance scenarios (scenario-author). No retries:
# a scenario passes or fails on its own run; flake is measured by verify.json.
testpaths = .
python_files = test_H*.py
markers =
    smoke: the most important journeys, the quick acceptance gate
addopts = -ra -p no:rerunfailures -p no:flaky -p no:randomly
xfail_strict = true
