[project]
name = "cro-lens"
version = "0.2.0"
description = "Evidence-backed landing page teardowns: one URL in, a checked A/B experiment backlog out."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.8",
  "playwright>=1.48",
  "pillow>=10.4",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.scripts]
cro-lens = "cro_lens.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-playwright>=0.5",
  "ruff>=0.7",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cro_lens"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# held-out scenarios are authored outside this repo and never edited here (holdout-lock)
extend-exclude = ["tests/acceptance/holdout"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["browser: needs Playwright chromium"]
